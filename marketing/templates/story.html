<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      body { width: 1080px; height: 1920px; }
      .art { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 300px 100px; }
      .frame { inset: 56px; }
      .necklace { position: static; width: 320px; margin-bottom: 34px; opacity: 0.85; }
      .wordmark { width: 470px; }
      .sub { font-weight: 300; letter-spacing: 0.44em; text-transform: uppercase; font-size: 23px; color: var(--blush); margin-top: 16px; }
      .headline { font-size: 84px; font-weight: 600; margin-top: 70px; text-align: center; }
      .lead { font-size: 31px; font-weight: 300; margin-top: 24px; max-width: 680px; text-align: center; line-height: 1.5; }
      .pill { font-size: 28px; padding: 18px 46px; margin-top: 46px; }
      .divider { margin-top: 60px; }
      .cta { text-align: center; margin-top: 40px; font-size: 27px; font-weight: 400; }
      .cta .script { font-size: 42px; display: block; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div class="art">
      <div class="frame"></div>
      <svg class="necklace" viewBox="0 0 320 150">
        <path d="M20 12 Q160 180 300 12" stroke-width="2.5" />
        <circle cx="76" cy="60" r="3.6" /><circle cx="110" cy="78" r="3.6" />
        <circle cx="210" cy="78" r="3.6" /><circle cx="244" cy="60" r="3.6" />
        <path d="M160 90 v11" stroke-width="2" />
        <path d="M160 101 L171 116 L160 131 L149 116 Z" fill="#c4a062" stroke="none" />
      </svg>
      {{WORDMARK}}
      <p class="sub">atacado</p>
      <h1 class="headline">Agora no atacado</h1>
      <p class="lead">Semijoias, acessórios e maquiagem para você revender</p>
      <span class="pill">Pedido mínimo R$ 490</span>
      <div class="divider"><span></span><i></i><span></span></div>
      <p class="cta"><span class="script">arrasta pra cima</span>e monte seu pedido · Retirada no Lindóia Shopping</p>
    </div>
  </body>
</html>
