<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      /* favicon.ico (16, 32 e 48 px): o mesmo círculo malva com o "G" do favicon.svg, fundo transparente. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; background: transparent; }
      body { display: grid; place-items: center; }
      .c { width: 100vmin; height: 100vmin; border-radius: 50%; background: #a86478; display: grid; place-items: center; }
      .g { width: 70%; height: 70%; display: grid; place-items: center; }
      .g svg { width: 100%; height: 100%; }
      /* traço extra proporcional ao tamanho: o G fino some em 16 px sem ele */
      .g path { fill: #faf6f7; stroke: #faf6f7; stroke-width: {{STROKE}}; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div class="c"><div class="g">{{MONOGRAM}}</div></div>
  </body>
</html>
