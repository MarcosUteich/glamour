<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      body { width: 1200px; height: 630px; }
      .art { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .frame { inset: 26px; }
      .wordmark { width: 360px; }
      .sub { font-weight: 300; letter-spacing: 0.44em; text-transform: uppercase; font-size: 16px; color: var(--blush); margin-top: 10px; }
      .headline { font-size: 46px; font-weight: 600; margin-top: 28px; }
      .lead { font-size: 20px; font-weight: 300; margin-top: 14px; }
      .pill { font-size: 16px; padding: 10px 24px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div class="art">
      <div class="frame"></div>
      {{WORDMARK}}
      <p class="sub">atacado</p>
      <h1 class="headline">Revenda Glamour</h1>
      <p class="lead">Semijoias, acessórios e maquiagem para lojistas</p>
      <span class="pill">Pedido mínimo R$ 490 · Retirada no Shopping Lindoia</span>
    </div>
  </body>
</html>
