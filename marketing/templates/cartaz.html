<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <style>
      body { width: 794px; height: 1123px; }
      .art { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
      .frame { inset: 34px; }
      .wordmark { width: 46%; margin-top: 90px; }
      .sub { font-weight: 300; letter-spacing: 0.44em; text-transform: uppercase; font-size: 18px; color: var(--blush); margin-top: 10px; }
      .headline { font-size: 50px; font-weight: 600; margin-top: 56px; text-align: center; line-height: 1.15; }
      .headline span { color: var(--dourado-claro); }
      .qr-box { background: var(--blush); border-radius: 24px; padding: 34px; margin-top: 44px; }
      .qr-box svg { width: 300px; height: 300px; display: block; }
      .instru { font-size: 22px; font-weight: 400; margin-top: 30px; }
      .divider { margin-top: 40px; }
      .details { margin-top: 34px; text-align: center; font-weight: 300; font-size: 20px; line-height: 1.9; }
      .details strong { font-weight: 600; }
      .foot { position: absolute; bottom: 70px; font-family: 'Yellowtail', cursive; font-size: 34px; color: var(--dourado-claro); }
    </style>
  </head>
  <body>
    <div class="art">
      <div class="frame"></div>
      {{WORDMARK}}
      <p class="sub">atacado</p>
      <h1 class="headline">Lojista?<br /><span>Compre no atacado</span></h1>
      <div class="qr-box">{{QR}}</div>
      <p class="instru">Aponte a câmera e monte seu pedido</p>
      <div class="divider"><span></span><i></i><span></span></div>
      <p class="details">
        Pedido mínimo <strong>R$ 490</strong><br />
        WhatsApp <strong>(51) 99227-5944</strong><br />
        Retirada na Glamour · Shopping Lindoia
      </p>
      <p class="foot">peças para você brilhar</p>
    </div>
  </body>
</html>
